[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tribes-api"
version = "0.1.0"
description = "Tribes persistence layer (Elasticsearch-backed) for the howwefeel app."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "elasticsearch[async]>=8.13,<9",
    "pydantic>=2",
    "pydantic-settings",
    "fastapi",
    "phonenumbers>=8.13",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "testcontainers[elasticsearch]>=4.7",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: pure unit tests (no external services)",
    "integration: tests that hit a real Elasticsearch instance",
    "regression_guard: tests that lock V1 invariants (e.g., vector-field absence)",
]
